name: fit_buddyy
description: "A mobile fitness app with Firebase integration."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  provider: ^6.1.2
  pedometer: ^4.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  fl_chart: ^0.70.2
  shared_preferences: ^2.2.1
  flutter_foreground_task: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
